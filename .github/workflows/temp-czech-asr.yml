name: Temporary Czech ASR dependencies

on:
  push:
    branches:
      - temp-czech-asr-20260831

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download public Czech Vosk model and Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            https://alphacephei.com/vosk/models/vosk-model-small-cs-0.4-rhasspy.zip \
            -o vosk-model-small-cs-0.4-rhasspy.zip
          curl -fL --retry 4 --retry-delay 5 \
            https://files.pythonhosted.org/packages/fc/ca/83398cfcd557360a3d7b2d732aee1c5f6999f68618d1645f38d53e14c9ff/vosk-0.3.45-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.whl \
            -o vosk-0.3.45-py3-none-manylinux.whl
          sha256sum vosk-model-small-cs-0.4-rhasspy.zip vosk-0.3.45-py3-none-manylinux.whl > SHA256SUMS.txt
      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: czech-asr-dependencies
          path: |
            vosk-model-small-cs-0.4-rhasspy.zip
            vosk-0.3.45-py3-none-manylinux.whl
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
